# Northstar Electronics sales assistant — v0 declarations.
# Intentionally simple first draft; routing guidance, argument conventions,
# missing-information handling and confirmation boundaries are improved in v2.
#
# Names and parameters are the team contract (CHECKLIST.md section 1.2) and must
# match tools/__init__.py, tools/<name>/tool.py and every eval case.
# The original IT Helpdesk declarations are kept in artifacts/it_reference/.
tools:
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: search_products
    description: "Tìm sản phẩm trong danh mục."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, laptop, phone, tablet, audio, wearable, accessory], default: "all", description: "Nhóm sản phẩm"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_stock
    description: "Kiểm tra tồn kho."
    parameters:
      type: object
      properties:
        sku: {type: string, description: "Mã sản phẩm"}
        warehouse: {type: string, enum: [hcm, hanoi, danang, online], description: "Kho"}
      required: [sku, warehouse]

  - name: get_order
    description: "Xem thông tin đơn hàng."
    parameters:
      type: object
      properties:
        order_id: {type: string, description: "Mã đơn hàng"}
        view: {type: string, enum: [all, items, payment, shipping, status], default: "all", description: "Phần cần xem"}
      required: [order_id]

  - name: lookup_customer
    description: "Tra cứu khách hàng."
    parameters:
      type: object
      properties:
        customer_id: {type: string, description: "Mã khách hàng"}
      required: [customer_id]

  - name: sales_policy
    description: "Tìm trong chính sách bán hàng nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, pricing_discount, payment, shipping, warranty, order_processing, data_privacy, external_tools], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: format_quote
    description: "Trình bày các dòng hàng thành báo giá."
    parameters:
      type: object
      properties:
        lines:
          type: array
          default: []
          description: "Các dòng hàng"
          items:
            type: object
            properties:
              sku: {type: string}
              name: {type: string}
              quantity: {type: integer}
              unit_price: {type: number}
        template: {type: string, enum: [brief, detailed, invoice_draft], default: "brief", description: "Mẫu báo giá"}
        title: {type: string, default: "Báo giá", description: "Tiêu đề"}
      required: [lines, template]

  - name: create_order
    description: "Tạo một đơn hàng."
    parameters:
      type: object
      properties:
        customer_id: {type: string, description: "Mã khách hàng"}
        sku: {type: string, description: "Mã sản phẩm"}
        quantity: {type: integer, default: 1, description: "Số lượng"}
        warehouse: {type: string, enum: [hcm, hanoi, danang, online], description: "Kho xuất hàng"}
        note: {type: string, default: "", description: "Ghi chú"}
        confirmed: {type: boolean, default: false, description: "Đã được xác nhận"}
      required: [customer_id, sku, quantity, warehouse]

  - name: search_product_web
    description: "Tìm thông tin công khai về một sản phẩm trên web. Chỉ truyền hãng, model và loại thông tin; không truyền mã khách, mã đơn hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        brand: {type: string, description: "Hãng, ví dụ Sony"}
        model: {type: string, description: "Model công khai, ví dụ WH-1000XM5"}
        query_type: {type: string, enum: [specs, reviews, official_price, compatibility], default: "specs", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [brand, model, query_type]
